  e.preventDefault(); const b = r.getBoundingClientRect(), below = e.clientY > b.top + b.height / 2;
  document.querySelectorAll('.lgo.over-t,.lgo.over-b').forEach(x => x.classList.remove('over-t', 'over-b'));
  if (r.dataset.k !== legDrag) r.classList.add(below ? 'over-b' : 'over-t');
});
document.addEventListener('drop', e => {
  if (!legDrag) return; const r = e.target.closest && e.target.closest('.lgo'); if (!r) return;
  e.preventDefault(); const k = r.dataset.k, below = r.classList.contains('over-b');
  const L = legendForms().map(f => f._key).filter(x => x !== legDrag), j = L.indexOf(k);
  if (j >= 0 && k !== legDrag){ L.splice(below ? j + 1 : j, 0, legDrag); state.legend.order = L; save(); renderPanel(); scheduleDraw(); }
});
document.addEventListener('dragend', () => { legDrag = null; document.querySelectorAll('.lgo').forEach(x => x.classList.remove('dragging', 'over-t', 'over-b')); });

document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!(await guardUnsaved('Dosyadaki kesiti açmadan'))) return;
    // Dosyadaki kütüphane mevcut kütüphaneyle birleştirilir
    const have = new Set(state.formations.map(x => x.id));
    const lib = [...state.formations, ...(data.formations || []).filter(x => !have.has(x.id))];
    const cp = {...(data.customPatterns || {}), ...state.customPatterns};
    delete data._lib; delete data._dirty;
    loadSection({...data, usedFormations:lib}, null);
    state.customPatterns = {...state.customPatterns, ...cp};
    state._dirty = true; save(true); toast('Dosya açıldı. Kesitlerim’e kaydetmeyi unutma.');
  }
  catch(err){ alert('Dosya okunamadı: ' + err.message); }
});
document.getElementById('upl').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file || uploadIdx < 0) return;
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 480 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    const id = uid();
    state.customPatterns[id] = {name:file.name.replace(/\.[^.]+$/, ''), data:c.toDataURL('image/jpeg', 0.88)};
    const f = state.formations[uploadIdx]; f.pattern = 'u:' + id; if (f.color === '#cccccc') f.color = '#ffffff';
    URL.revokeObjectURL(im.src); save(); renderPanel(); scheduleDraw();
  };
  im.src = URL.createObjectURL(file);
});

/* =========================================================
   GÖRSELDEN ARAZİ PROFİLİ (Google Earth vb. yükseklik profili)
   1) Arazi çizgisinin rengi otomatik bulunur (ya da görselde tıklanarak seçilir)
   2) Her sütundaki aday noktalardan sürekliliği en iyi olan yol seçilir;
      etiket kutuları, yazılar ve ızgara çizgileri böylece elenir
   3) Kot ve mesafe yazıları yazı tanıma (OCR) ile okunup ölçek kurulur;
      kullanıcı turuncu (kot) ve yeşil (başlangıç/bitiş) çizgilerle kontrol eder
   ========================================================= */
let PI = null;
const PI_DETAIL = {az:0.02, orta:0.008, cok:0.003};
const piClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const piFmt = v => String(+(+v).toFixed(2)).replace('.', ',');
const isImgFile = f => !!f && (/^image\//.test(f.type || '') || /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name || ''));

function loadImageFile(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}

async function openProfileImport(file){
  if (!isImgFile(file)){ alert('Lütfen bir görsel dosyası (JPG veya PNG) seçin.'); return; }
  let im;
  try { im = await loadImageFile(file); }
  catch(e){ alert('Görsel açılamadı. Dosya JPG veya PNG olmalı (iPhone HEIC fotoğraflarını önce JPG olarak kaydedin).'); return; }
  const nw = im.naturalWidth, nh = im.naturalHeight;
  if (nw < 60 || nh < 40){ alert('Görsel çok küçük; profil okunamaz.'); return; }
  const k = Math.min(1, 2600 / Math.max(nw, nh));
  const w = Math.round(nw * k), h = Math.round(nh * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);
  const data = g.getImageData(0, 0, w, h).data;
  const DR = findDarkRows(data, w, h), darkBg = DR.reduce((a, b) => a + b, 0) > h * 0.5;
  const auto = guessLineColor(data, w, h, DR, darkBg);
  PI = {DR, darkBg, id:uid(), name:file.name || 'Yapıştırılan görsel', src:c, w, h, data, color:auto, autoColor:auto,
        path:null, x0:0, x1:w - 1, xs:0, xe:w - 1, y1:null, y2:null, v1:null, v2:null, L:null, mpp:null,
        detail:'orta', fitAxis:true, pick:false, touchedY:false, touchedL:false, grid:[], ocr:'run', drag:null, mouse:null};
  detectProfile(PI);
  setDefaultRefs(PI);
  showProfileModal();
  runProfileOCR(PI);
}

// Görselde en çok bulunan koyu ve renkli ton = profil çizgisi. Renkli ton yoksa koyu (siyah) çizgi aranır.
// Zemini siyah/koyu olan satırlar (ör. alttaki koyu mesafe bandı). Bunlar çizgi aranırken yok sayılır.
function findDarkRows(d, w, h){
  const out = new Uint8Array(h), sx = Math.max(1, Math.floor(w / 300));
  for (let y = 0; y < h; y++){
    const v = [];
    for (let x = 0; x < w; x += sx){ const i = (y * w + x) * 4; v.push(0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]); }
    v.sort((a, b) => a - b); out[y] = v[v.length >> 1] < 80 ? 1 : 0;
  }
  return out;
}
// darkBg: görselin büyük kısmı koyu zeminli (koyu temalı grafik) → açık renkli çizgi aranır
function guessLineColor(d, w, h, DR, darkBg){
  const step = Math.max(1, Math.floor(Math.sqrt(w * h / 600000)));
  const bins = new Map(), dark = [0, 0, 0, 0];
  for (let y = 0; y < h; y += step){
    if (!darkBg && DR[y]) continue;
    for (let x = 0; x < w; x += step){
      const i = (y * w + x) * 4, r = d[i], g = d[i+1], b = d[i+2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b, ch = Math.max(r, g, b) - Math.min(r, g, b);
      if (darkBg ? (lum >= 90 && ch > 60) : (lum < 175 && ch > 60)){
        const key = (r >> 4) * 256 + (g >> 4) * 16 + (b >> 4), e = bins.get(key);
        if (e){ e[0]++; e[1] += r; e[2] += g; e[3] += b; } else bins.set(key, [1, r, g, b]);
      } else if (darkBg ? lum > 170 : lum < 90){ dark[0]++; dark[1] += r; dark[2] += g; dark[3] += b; }
    }
  }
  const around = key => {
    const r = key >> 8, g = (key >> 4) & 15, b = key & 15, s = [0, 0, 0, 0];
    for (let dr = -1; dr <= 1; dr++) for (let dg = -1; dg <= 1; dg++) for (let db = -1; db <= 1; db++){
      const rr = r + dr, gg = g + dg, bb = b + db;
      if (rr < 0 || gg < 0 || bb < 0 || rr > 15 || gg > 15 || bb > 15) continue;
      const e = bins.get(rr * 256 + gg * 16 + bb); if (e) for (let q = 0; q < 4; q++) s[q] += e[q];
    }
    return s;
  };
  let bestK = -1, bestN = 0;
  for (const key of bins.keys()){ const n = around(key)[0]; if (n > bestN){ bestN = n; bestK = key; } }
  if (bestK >= 0 && bestN >= (w / step) * 0.25){
    const s = around(bestK);
    return {r:s[1] / s[0], g:s[2] / s[0], b:s[3] / s[0], dark:false};
  }
  if (dark[0]) return {r:dark[1] / dark[0], g:dark[2] / dark[0], b:dark[3] / dark[0], dark:!darkBg};
  return darkBg ? {r:255, g:255, b:255, dark:false} : {r:0, g:0, b:0, dark:true};
}

function detectProfile(P){
  const {w, h, data:d, color:C} = P;
  const tol = C.dark ? 95 : 85, tol2 = tol * tol;
  const M = new Uint8Array(w * h), rowN = new Int32Array(h), colN = new Int32Array(w);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (!P.darkBg && P.DR[y]) continue;
    const i = (y * w + x) * 4, dr = d[i] - C.r, dg = d[i+1] - C.g, db = d[i+2] - C.b;
    if (dr * dr + dg * dg + db * db < tol2){ M[y * w + x] = 1; rowN[y]++; colN[x]++; }
  }
  // Boydan boya düz çizgiler (eksen, çerçeve) profil değildir
  for (let y = 0; y < h; y++) if (rowN[y] > w * 0.75) M.fill(0, y * w, y * w + w);
  // Dikey eksen çizgileri profilin geçemeyeceği sınırdır (eksenin dışındaki yazılar profile eklenmez)
  const bar = new Int32Array(w + 1);
  for (let x = 0; x < w; x++){
    const isBar = colN[x] > h * 0.75;
    if (isBar) for (let y = 0; y < h; y++) M[y * w + x] = 0;
    bar[x + 1] = bar[x] + (isBar ? 1 : 0);
  }
  const crossesBar = (xa, xb) => bar[Math.max(xa, xb)] - bar[Math.min(xa, xb) + 1] > 0;

  // Her sütundaki kesintisiz parçalar
  const runs = [], lens = [];
  for (let x = 0; x < w; x++){
    const R = []; let a = -1;
    for (let y = 0; y <= h; y++){
      const on = y < h && M[y * w + x];
      if (on && a < 0) a = y;
      else if (!on && a >= 0){ R.push([a, y - 1]); lens.push(y - a); a = -1; }
    }
    runs.push(R);
  }
  P.path = null;
  if (!lens.length) return;
  lens.sort((a, b) => a - b);
  const T = Math.max(1, lens[lens.length >> 1]);
  const filled = T > h * 0.12;              // çizgi değil dolu alan: üst kenar alınır
  const cand = runs.map(R => {
    const out = [];
    for (const [a, b] of R){
      if (filled){ out.push([a, 0, a, b]); continue; }
      out.push([(a + b) / 2, 0, a, b]);
      // Çizgiye yapışık etiket kutusu vb.: parçanın üst ve alt kenarı da aday
      if (b - a + 1 > T * 2.5){ out.push([a + (T - 1) / 2, 3, a, b]); out.push([b - (T - 1) / 2, 3, a, b]); }
    }
    return out.length > 30 ? out.slice(0, 30) : out;
  });

  // En iyi yol (dinamik programlama): kapsanan her sütun ödül, dikey sıçrama ceza
  const K = Math.max(6, Math.round(w * 0.03)), RW = 6;
  const best = new Array(w), bx = new Array(w), bj = new Array(w);
  let gBest = Infinity, gx = -1, gj = -1;
  for (let x = 0; x < w; x++){
    const C1 = cand[x], n = C1.length;
    const B = new Float64Array(n), PX = new Int32Array(n).fill(-1), PJ = new Int32Array(n).fill(-1);
    for (let i = 0; i < n; i++){
      const y = C1[i][0]; let m = 0, px = -1, pj = -1;
      for (let k = 1; k <= K && x - k >= 0; k++){
        const C0 = cand[x - k], B0 = best[x - k];
        for (let j = 0; j < C0.length; j++){
          const v = B0[j] + Math.abs(y - C0[j][0]);
          if (v < m){ m = v; px = x - k; pj = j; }
        }
      }
      B[i] = m + C1[i][1] - RW; PX[i] = px; PJ[i] = pj;
      if (B[i] < gBest){ gBest = B[i]; gx = x; gj = i; }
    }
    best[x] = B; bx[x] = PX; bj[x] = PJ;
  }
  if (gx < 0) return;
  const chosen = [];
  for (let x = gx, j = gj; x >= 0 && j >= 0;){ const c = cand[x][j]; chosen.push({x, y:c[0], a:c[2], b:c[3]}); const px = bx[x][j], pj = bj[x][j]; x = px; j = pj; }
  chosen.reverse();
  // Yolu birbirine değen parçalara ayır; ana parçaya düzgün bağlanmayan kısa parçalar (yazı, simge) atılır
  const segs = [];
  for (const c of chosen){
    const s = segs[segs.length - 1], p = s && s.pts[s.pts.length - 1];
    if (p && c.x - p.x <= 2 && c.a <= p.b + 2 && c.b >= p.a - 2 && !crossesBar(p.x, c.x)) s.pts.push(c);
    else segs.push({pts:[c]});
  }
  let mi = 0; segs.forEach((s, i) => { if (s.pts.length > segs[mi].pts.length) mi = i; });
  const keep = new Set([mi]);
  const joins = (A, B, gap) => gap <= K && Math.abs(A.y - B.y) <= Math.max(2 * T + 2, gap + T) && !crossesBar(A.x, B.x);
  for (let dir = -1; dir <= 1; dir += 2){
    let cur = segs[mi];
    for (let i = mi + dir; i >= 0 && i < segs.length; i += dir){
      const S = segs[i];
      const A = dir < 0 ? cur.pts[0] : cur.pts[cur.pts.length - 1], B = dir < 0 ? S.pts[S.pts.length - 1] : S.pts[0];
      const gap = Math.abs(A.x - B.x);
      if (gap > K) break;
      if (joins(A, B, gap)){ keep.add(i); cur = S; }
    }
  }
  const path = new Float64Array(w).fill(NaN);
  segs.forEach((s, i) => { if (keep.has(i)) s.pts.forEach(c => { path[c.x] = c.y; }); });
  let x0 = -1, x1 = -1;
  for (let x = 0; x < w; x++) if (isFinite(path[x])){ if (x0 < 0) x0 = x; x1 = x; }
  if (x0 < 0 || x1 - x0 < w * 0.1) return;
  // Boşlukları doğrusal doldur
  for (let x = x0, last = x0; x <= x1; x++){
    if (!isFinite(path[x])) continue;
    for (let q = last + 1; q < x; q++) path[q] = path[last] + (path[x] - path[last]) * (q - last) / (x - last);
    last = x;
  }
  P.path = path; P.x0 = x0; P.x1 = x1; P.xs = x0; P.xe = x1; P.thick = T;
  P.grid = findGridRows(P);
  P.gy = gridProgression(P.grid); P.gx = gridProgression(findGridCols(P)); P.band = findLabelBand(P);
}

// Yatay ızgara çizgileri (referans çizgilerini bunlara yapıştırmak için)
function findGridRows(P){
  const {w, h, data:d, x0, x1} = P, lum = (x, y) => { const i = (y * w + x) * 4; return 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]; };
  const sx = Math.max(1, Math.floor((x1 - x0 + 1) / 700)), rows = [], S = new Float64Array(h);
  for (let y = 2; y < h - 2; y++){
    let n = 0, c = 0, s = 0;
    for (let x = x0; x <= x1; x += sx){ n++; const dv = Math.abs(lum(x, y) - (lum(x, y - 2) + lum(x, y + 2)) / 2); s += dv; if (dv > 5) c++; }
    S[y] = s / n;
    if (c > n * 0.55) rows.push(y);
  }
  // Yakın satırlardan en belirgin olanı (çizginin ±2 komşuları da işaretlenir)
  const out = [];
  for (let i = 0; i < rows.length;){
    let j = i; while (j + 1 < rows.length && rows[j + 1] - rows[j] <= 3) j++;
    let m = rows[i]; for (let q = i; q <= j; q++) if (S[rows[q]] > S[m]) m = rows[q];
    const ties = rows.slice(i, j + 1).filter(r => Math.abs(S[r] - S[m]) < 1e-9 && Math.abs(r - m) <= 1);
    out.push(ties.reduce((a, b) => a + b, 0) / ties.length);
    i = j + 1;
  }
  return out;
}
// Dikey ızgara çizgileri (mesafe yazıları bunların hizasındadır)
function findGridCols(P){
  const {w, h, data:d, x0, x1, path} = P, lum = (x, y) => { const i = (y * w + x) * 4; return 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]; };
  let y0 = Infinity, y1 = -Infinity;
  for (let x = x0; x <= x1; x++) if (isFinite(path[x])){ y0 = Math.min(y0, path[x]); y1 = Math.max(y1, path[x]); }
  y0 = Math.max(2, Math.floor(y0)); y1 = Math.min(h - 3, Math.ceil(y1));
  if (y1 - y0 < 10) return [];
  const sy = Math.max(1, Math.floor((y1 - y0 + 1) / 400)), cols = [], S = new Float64Array(w);
  for (let x = Math.max(2, x0); x <= Math.min(w - 3, x1); x++){
    let n = 0, c = 0, s = 0;
    for (let y = y0; y <= y1; y += sy){ n++; const dv = Math.abs(lum(x, y) - (lum(x - 2, y) + lum(x + 2, y)) / 2); s += dv; if (dv > 5) c++; }
    S[x] = s / n;
    if (c > n * 0.55) cols.push(x);
  }
  const out = [];
  for (let i = 0; i < cols.length;){
    let j = i; while (j + 1 < cols.length && cols[j + 1] - cols[j] <= 3) j++;
    let m = cols[i]; for (let q = i; q <= j; q++) if (S[cols[q]] > S[m]) m = cols[q];
    out.push(m); i = j + 1;
  }
  return out;
}
function snapTo(list, v, tol){
  let best = v, bd = tol;
  for (const g of list){ const dd = Math.abs(g - v); if (dd <= bd){ bd = dd; best = g; } }
  return best;
}
function snapGrid(P, y, tol){
  let best = y, bd = tol;
  for (const g of P.grid){ const dd = Math.abs(g - y); if (dd <= bd){ bd = dd; best = g; } }
  return best;
}
function setDefaultRefs(P){
  const gp = P.path && gridProgression(P.grid);
  if (gp && gp.mem.length >= 3){ P.y1 = gp.mem[0].pos; P.y2 = gp.mem[gp.mem.length - 1].pos; return; }
  let lo = P.h * 0.2, hi = P.h * 0.8;
  if (P.path){
    let a = Infinity, b = -Infinity;
    for (let x = P.x0; x <= P.x1; x++){ a = Math.min(a, P.path[x]); b = Math.max(b, P.path[x]); }
    if (b - a > 10){ lo = a; hi = b; }
  }
  const t1 = lo + (hi - lo) * 0.1, t2 = hi - (hi - lo) * 0.1;
  const near = t => P.grid.reduce((m, g) => Math.abs(g - t) < Math.abs(m - t) ? g : m, Infinity);
  const g1 = near(t1), g2 = near(t2);
  if (isFinite(g1) && isFinite(g2) && g2 - g1 > (hi - lo) * 0.3){ P.y1 = g1; P.y2 = g2; }
  else { P.y1 = Math.round(lo); P.y2 = Math.round(hi); }
}
function redetectProfile(){
  const P = PI; if (!P) return;
  detectProfile(P);
  if (P.path && P.mpp && !P.touchedL) P.L = Math.round(P.mpp * (P.xe - P.xs));
  if (!P.touchedY && P.ocr !== 'ok') setDefaultRefs(P);
  const b = document.querySelector('[data-action="piPick"]'); if (b) b.classList.remove('on-pick');
  setPIStatus(); updatePI();
}
function pickLineColor(x, y){
  const P = PI, X = Math.round(x), Y = Math.round(y), d = P.data;
  const ch = [[], [], []];
  for (let yy = Y - 6; yy <= Y + 6; yy++) for (let xx = X - 6; xx <= X + 6; xx++){
    if (xx < 0 || yy < 0 || xx >= P.w || yy >= P.h) continue;
    const i = (yy * P.w + xx) * 4; ch[0].push(d[i]); ch[1].push(d[i+1]); ch[2].push(d[i+2]);
  }
  if (!ch[0].length) return;
  const bg = ch.map(a => a.sort((p, q) => p - q)[a.length >> 1]);
  let best = null, bd = -1;
  for (let yy = Y - 3; yy <= Y + 3; yy++) for (let xx = X - 3; xx <= X + 3; xx++){
    if (xx < 0 || yy < 0 || xx >= P.w || yy >= P.h) continue;
    const i = (yy * P.w + xx) * 4, dd = (d[i] - bg[0]) ** 2 + (d[i+1] - bg[1]) ** 2 + (d[i+2] - bg[2]) ** 2;
    if (dd > bd){ bd = dd; best = i; }
  }
  if (best === null) return;
  const r = P.data[best], g = P.data[best+1], b = P.data[best+2];
  P.color = {r, g, b, dark:Math.max(r, g, b) - Math.min(r, g, b) < 40 && 0.299 * r + 0.587 * g + 0.114 * b < 110};
  P.pick = false; redetectProfile();
}

/* ---- Yazı tanıma: kot ve mesafe etiketleri ---- */
let ocrWorkerP = null;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('zaman aşımı')), ms))]);
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => { s.remove(); rej(new Error('yüklenemedi')); };
    document.head.appendChild(s);
  });
}
function getOCRWorker(){

function buildProfilePts(){
  const P = PI;

  if (P.v1 === null || P.v2 === null) return {err:'Turuncu çizgilerin kotlarını girin (görseldeki kot yazılarına bakın).'};
  if (Math.abs(P.y1 - P.y2) < 2) return {err:'İki turuncu çizgi birbirinden ayrı olmalı.'};
  if (P.v1 === P.v2) return {err:'İki turuncu çizginin kotu farklı olmalı.'};
  if ((P.y1 < P.y2) !== (P.v1 > P.v2)) return {err:'Üstteki turuncu çizginin kotu alttakinden büyük olmalı.'};

      g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(m.pos - tw / 2 - 3 * px, ty, tw + 6 * px, 14 * px);
      g.fillStyle = '#00695c'; g.fillText(t, m.pos, ty + px);
    }
  }
  g.lineWidth = 1.6 * px; g.strokeStyle = '#ef6c00'; g.setLineDash([7 * px, 4 * px]);
  for (const [y, v, n] of [[P.y1, P.v1, 'Üst'], [P.y2, P.v2, 'Alt']]){
    if (y === null) continue;
    g.beginPath(); g.moveTo(0, y + .5); g.lineTo(P.w, y + .5); g.stroke();
    label(`${n}: ${v === null ? 'kot ?' : piFmt(v) + ' m'}`, P.w * 0.5, y + .5, '#ef6c00');
  }
  g.setLineDash([]);
  // Büyüteç: sürüklerken ya da renk seçerken
  const m = P.drag ? [P.drag.mx ?? P.mouse?.[0], P.drag.my ?? P.mouse?.[1]] : P.pick ? P.mouse : null;
  if (m && isFinite(m[0]) && isFinite(m[1])){
    const Z = 4, iw = 190 * px, ih = 120 * px, sw = iw / Z, sh = ih / Z;
    const ix = m[0] > P.w / 2 ? 6 * px : P.w - iw - 6 * px, iy = 6 * px;
    const sx = piClamp(m[0] - sw / 2, 0, Math.max(0, P.w - sw)), sy = piClamp(m[1] - sh / 2, 0, Math.max(0, P.h - sh));
    g.save(); g.imageSmoothingEnabled = false;
    g.fillStyle = '#fff'; g.fillRect(ix, iy, iw, ih);
    g.drawImage(P.src, sx, sy, sw, sh, ix, iy, iw, ih);
    g.beginPath(); g.rect(ix, iy, iw, ih); g.clip();
    const tx = x => ix + (x - sx) * Z, ty = y => iy + (y - sy) * Z;
    g.lineWidth = 1.5 * px;
    if (P.drag && (P.drag.k === 'y1' || P.drag.k === 'y2')){ const y = P[P.drag.k]; g.strokeStyle = '#ef6c00'; g.beginPath(); g.moveTo(ix, ty(y + .5)); g.lineTo(ix + iw, ty(y + .5)); g.stroke(); }
    else if (P.drag){ const x = P[P.drag.k]; g.strokeStyle = '#2e7d32'; g.beginPath(); g.moveTo(tx(x + .5), iy); g.lineTo(tx(x + .5), iy + ih); g.stroke(); }
    else { g.strokeStyle = '#ef6c00'; g.beginPath(); g.moveTo(tx(m[0]), iy); g.lineTo(tx(m[0]), iy + ih); g.moveTo(ix, ty(m[1])); g.lineTo(ix + iw, ty(m[1])); g.stroke(); }
    g.restore();
    g.strokeStyle = '#334155'; g.lineWidth = 1.5 * px; g.strokeRect(ix, iy, iw, ih);
  }
}
function piPos(e){ const r = e.currentTarget.getBoundingClientRect(); return [(e.clientX - r.left) / PI.s, (e.clientY - r.top) / PI.s]; }
function piHit(x, y){
  const P = PI, tol = 8 / P.s; let best = null, bd = tol;
  const test = (k, d) => { if (d < bd){ bd = d; best = k; } };
  if (P.y1 !== null) test('y1', Math.abs(y - P.y1));
  if (P.y2 !== null) test('y2', Math.abs(y - P.y2));
  if (P.path){ test('xs', Math.abs(x - P.xs)); test('xe', Math.abs(x - P.xe)); }
  return best;
}
function piDown(e){
  if (!PI) return;
  const [x, y] = piPos(e);
  if (PI.pick){ pickLineColor(x, y); return; }
  const k = piHit(x, y); if (!k) return;
  PI.drag = {k, mx:x, my:y}; e.currentTarget.setPointerCapture(e.pointerId); e.preventDefault(); drawPI();
}
function piMove(e){
  const P = PI; if (!P) return;
  const [x, y] = piPos(e); P.mouse = [x, y];
  if (!P.drag){
    const k = P.pick ? 'pick' : piHit(x, y);
    e.currentTarget.style.cursor = k === 'pick' ? 'crosshair' : k === 'y1' || k === 'y2' ? 'ns-resize' : k ? 'ew-resize' : 'default';
    if (P.pick) drawPI();
    return;
  }
  const k = P.drag.k; P.drag.mx = x; P.drag.my = y;
  if (k === 'y1' || k === 'y2'){ P[k] = snapGrid(P, piClamp(Math.round(y * 2) / 2, 0, P.h - 1), 4 / P.s); P.touchedY = true; }
  else if (k === 'xs') P.xs = Math.round(piClamp(x, 0, P.xe - 5));
  else P.xe = Math.round(piClamp(x, P.xs + 5, P.w - 1));
  if ((k === 'xs' || k === 'xe') && P.mpp && !P.touchedL) P.L = Math.round(P.mpp * (P.xe - P.xs));
  updatePI();
}
function piUp(){
  const P = PI; if (!P || !P.drag) return;
  P.drag = null;
  if (P.y1 !== null && P.y2 !== null && P.y1 > P.y2){ [P.y1, P.y2] = [P.y2, P.y1]; [P.v1, P.v2] = [P.v2, P.v1]; }
  updatePI();
}
document.getElementById('modal').addEventListener('input', e => {
  const P = PI; if (!P) return;
  const el = e.target;
  if (el.id === 'piV1'){ P.v1 = num(el.value); P.touchedY = true; }
  else if (el.id === 'piV2'){ P.v2 = num(el.value); P.touchedY = true; }
  else if (el.id === 'piL'){ P.L = num(el.value); P.touchedL = true; }
  else if (el.id === 'piDetail') P.detail = el.value;
  else if (el.id === 'piFit') P.fitAxis = el.checked;
  else return;
  updatePI();
});
function profNiceStep(r){
  const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return Math.max(1, (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p);
}
// Eksik/hatalı değeri açıkça gösterir: mesaj, kırmızı kutu, imleç o kutuya
function showPIError(msg){
  const P = PI; if (!P) return;
  updatePI();
  const info = document.getElementById('piInfo');
  if (info){ info.classList.remove('shake'); void info.offsetWidth; info.classList.add('shake'); }
  const miss = P.v1 === null ? 'piV1' : P.v2 === null ? 'piV2' : !(P.L > 0) ? 'piL' : null;
  if (miss){ const el = document.getElementById(miss); el.classList.add('bad'); el.focus(); }
  toast(msg);
}
// Kot cetveli profilin gerçek en yüksek ve en düşük kotundan başlar/biter (yuvarlanmaz);
// ara değerler görseldeki cetvelin adımıyla düz sayılardır (ör. 1528, 1520, 1510 … 1420, 1410)
function profileRuler(r){
  const R = PI && PI.ruler || {};
  // Adım: görseldeki cetvelin adımı (okunduysa) ya da ızgara aralığından; yoksa kot aralığından
  const P = PI, gridStep = P && P.gy && P.v1 !== null && P.v2 !== null && P.y2 !== P.y1 ? Math.abs((P.v2 - P.v1) / (P.y2 - P.y1) * P.gy.s) : 0;
  const st = R.step > 0 ? R.step : gridStep > 0 ? niceRound(gridStep) : profNiceStep(Math.max(1, r.max - r.min));
  let top = Math.ceil(r.max - 1e-9), bot = Math.floor(r.min + 1e-9);
  if (R.top !== null && R.top !== undefined && R.top >= r.max - 2 && R.top <= r.max + st) top = Math.max(top, R.top);
  if (R.bot !== null && R.bot !== undefined && R.bot <= r.min + 2 && R.bot >= r.min - st) bot = Math.min(bot, R.bot);
  if (top <= bot) bot = top - st;
  return {start:top, step:st, end:bot};
}
function applyProfileImport(){
  const P = PI; if (!P) return;
  const r = buildProfilePts();
  if (r.err){
    // Yazılar hâlâ okunuyorsa okuma bitince kendiliğinden aktarılır
    if (P.ocr === 'run' && P.path){ P.autoApply = true; updatePI(); return; }
    showPIError(r.err); return;
  }
  ui.prevTopo = JSON.parse(JSON.stringify({topo:state.topo, axis:state.axis}));
  state.topo.pts = r.pts; state.topo.length = r.pts[r.pts.length - 1][0];
  const {top, base} = axisRange();
  const outside = r.max > top || r.min < base;
  if (P.fitAxis || outside){
    const A = profileRuler(r);
    state.axis.left = {...state.axis.left, ...A};
    if (!state.axis.right.same) state.axis.right = {...state.axis.right, ...A};
    state.axis.round = true;
  }
  ui.flatElev = null; ui.tab = 'kesit';
  PI = null; closeModal(); save(); renderPanel(); scheduleDraw();
  toast(`Arazi profili aktarıldı: ${r.pts.length} nokta, ${piFmt(state.topo.length)} m` + (!P.fitAxis && outside ? ' (kot cetveli profile göre ayarlandı)' : ''));
}

/* =========================================================
   KESİTLERİM — tarayıcı hafızasında (IndexedDB) kayıtlı kesitler
   ========================================================= */
const KDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('jeokesit', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kesitler', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kesitler', mode), req = fn(t.objectStore('kesitler'));
      t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error);
    });
  };
  return {all:() => run('readonly', s => s.getAll()), get:id => run('readonly', s => s.get(id)),
          put:rec => run('readwrite', s => s.put(rec)), del:id => run('readwrite', s => s.delete(id))};
})();

let V3 = null;
function open3D(){
  if (!window.THREE || !THREE.OrbitControls){ alert('3D kütüphanesi yüklenemedi. "lib" klasörünün index.html ile aynı yerde olduğundan emin olun.'); return; }

function init3D(){
  const host = document.getElementById('v3dCanvas');
  const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9eef3);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.4;
  controls.minDistance = 3; controls.maxDistance = 80;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 0.95));
  const dl = new THREE.DirectionalLight(0xffffff, 0.35); dl.position.set(6, 12, 9); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.2); dl2.position.set(-8, 4, -6); scene.add(dl2);
  const grid = new THREE.GridHelper(40, 40, 0xb8c2cc, 0xd3dae1); scene.add(grid);
  const group = new THREE.Group(); scene.add(group);
  V3 = {renderer, scene, camera, controls, group, grid, depth:0.3, vmul:1, disp:[]};
  const loop = () => {
    requestAnimationFrame(loop);
    if (!document.getElementById('v3d').classList.contains('on')) return;
    controls.update(); renderer.render(scene, camera);
  };
  loop();
  window.addEventListener('resize', () => { if (V3) resize3D(); });
  document.getElementById('v3Depth').addEventListener('input', e => { V3.depth = +e.target.value; rebuild3D(); });
  document.getElementById('v3Vmul').addEventListener('input', e => { V3.vmul = +e.target.value; rebuild3D(); });
}
function resize3D(){
  const host = document.getElementById('v3dCanvas'), w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  V3.renderer.setSize(w, h, false); V3.camera.aspect = w / h; V3.camera.updateProjectionMatrix();
}
function reset3DView(){
  const d = V3.dims || {Lw:10, Hw:3, Dw:3};
  V3.camera.position.set(d.Lw * 0.55, d.Hw * 0.9 + 4, d.Lw * 1.15 + d.Dw);
  V3.controls.target.set(0, d.Hw * 0.35, 0); V3.controls.update();
}
function textSprite(txt, color = '#111', size = 44){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `bold ${size}px Arial`; const w = Math.ceil(g.measureText(txt).width) + 24;
  c.width = w; c.height = size + 20;
  g.font = `bold ${size}px Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 8; g.strokeStyle = 'rgba(255,255,255,.95)'; g.strokeText(txt, w / 2, c.height / 2);
  g.fillStyle = color; g.fillText(txt, w / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  const k = 0.0048; sp.scale.set(w * k, c.height * k, 1); sp.renderOrder = 10;
  V3.disp.push(tex, sp.material);
  return sp;
}
function rebuild3D(){
  if (!V3) return;
  // Eskileri temizle
  V3.group.children.slice().forEach(o => { V3.group.remove(o); o.geometry && o.geometry.dispose(); });
  V3.disp.forEach(d => d.dispose && d.dispose()); V3.disp = [];

  // 2D kesiti çiz ve kesit alanını doku olarak kes
  const S = 1.5, off = document.createElement('canvas');
  const r = draw(off, S, false); if (!r) return;
  const {m, lay} = r;
  const fc = document.createElement('canvas');
  fc.width = Math.round(lay.plotW * S); fc.height = Math.round(lay.plotH * S);
  fc.getContext('2d').drawImage(off, lay.ml * S, lay.mt * S, lay.plotW * S, lay.plotH * S, 0, 0, fc.width, fc.height);

  const Lw = 10, Hw = 10 * lay.plotH / lay.plotW * V3.vmul, Dw = Lw * V3.depth;
  V3.dims = {Lw, Hw, Dw};
  const len = m.xmax - m.xmin, rng = m.top - m.base;
  const WX = x => (x - m.xmin) / len * Lw - Lw / 2;
  const WY = el => (el - m.base) / rng * Hw;
  const U = x => (x - m.xmin) / len, V = el => (el - m.base) / rng;
  const xs = m.gxs, zf = Dw / 2, zb = -Dw / 2;

  // Bir noktadaki birim (en üstteki gövde, yoksa ana birim)
  const ownerAt = (x, y) => {
    for (let k = m.polys.length - 1; k >= 0; k--){
      const p = m.polys[k];
      if (inPoly(p.pts, x, y)){
        const isBg = p.body.fid === '__bg';
        return {f:effF(fById(p.fid), isBg ? state.bgColor : p.body.color), sc:isBg ? state.bgScale : p.body.pscale, key:p.fid + '#' + k};
      }
    }
    return {f:effF(fById(state.bg), state.bgColor), sc:state.bgScale, key:'bg'};
  };
  const texFrom = cnv => { const t = new THREE.CanvasTexture(cnv); t.anisotropy = 8; V3.disp.push(t); return t; };
  const mat = (map, side = THREE.DoubleSide) => { const mm = new THREE.MeshLambertMaterial({map, side, color:map ? 0xffffff : 0x8e969e}); V3.disp.push(mm); return mm; };
  const mesh = (pos, uv, idx, material) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    if (uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const o = new THREE.Mesh(g, material); V3.group.add(o); return o;
  };

  // Ön ve arka yüz (kesit dokusu)
  const faceTex = texFrom(fc);
  for (const [z, flip] of [[zf, false], [zb, true]]){
    const pos = [], uv = [], idx = [];
    xs.forEach((x, i) => {
      const g = m.ground(x);
      pos.push(WX(x), WY(g), z, WX(x), 0, z); uv.push(U(x), V(g), U(x), 0);
      if (i){ const a = (i - 1) * 2, b = i * 2; flip ? idx.push(a, a + 1, b, b, a + 1, b + 1) : idx.push(a, b, a + 1, b, b + 1, a + 1); }
    });
    mesh(pos, uv, idx, mat(faceTex));
  }

  // Üst yüzey: yüzeylenen birimlerin desenleri
  const pxPerW = lay.plotW / Lw;                      // mantıksal px / dünya birimi
  const tc = document.createElement('canvas'), tW = lay.plotW, tH = Math.max(8, Math.round(Dw * pxPerW));
  tc.width = Math.round(tW * S); tc.height = Math.round(tH * S);
  const tg = tc.getContext('2d'); tg.scale(S, S);
  const eps = rng * 0.004;
  let runStart = 0, runOwner = null;
  const N = 400;
  for (let i = 0; i <= N; i++){
    const x = m.xmin + len * Math.min(i, N - 0.001) / N, o = i < N ? ownerAt(x, m.ground(x) - eps) : null;
    if (!runOwner || !o || o.key !== runOwner.key){
      if (runOwner){ tg.beginPath(); tg.rect(runStart / N * tW, 0, (i - runStart) / N * tW + 1, tH); fillFormation(tg, runOwner.f, S, runOwner.sc); }
      runOwner = o; runStart = i;
    }
  }
  {
    const pos = [], uv = [], idx = [];
    xs.forEach((x, i) => {
      const y = WY(m.ground(x));
      pos.push(WX(x), y, zf, WX(x), y, zb); uv.push(U(x), 1, U(x), 0);
      if (i){ const a = (i - 1) * 2, b = i * 2; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    });
    mesh(pos, uv, idx, mat(texFrom(tc)));
  }

  // Yan yüzler: o noktadaki düşey istif
  for (const [x, side] of [[m.xmin + len * 0.0005, 'L'], [m.xmax - len * 0.0005, 'R']]){
    const g0 = m.ground(x);
    const ec = document.createElement('canvas'), eW = tH, eH = lay.plotH;
    ec.width = Math.round(eW * S); ec.height = Math.round(eH * S);
    const eg = ec.getContext('2d'); eg.scale(S, S);
    const NY = 300; let rs = 0, ro = null;
    for (let j = 0; j <= NY; j++){
      const el = m.top - rng * Math.min(j, NY - 0.001) / NY;
      const o = j < NY ? (el > g0 ? {key:'air'} : ownerAt(x, el)) : null;
      if (!ro || !o || o.key !== ro.key){
        if (ro && ro.f){ eg.beginPath(); eg.rect(0, rs / NY * eH, eW, (j - rs) / NY * eH + 1); fillFormation(eg, ro.f, S, ro.sc); }
        ro = o; rs = j;
      }
    }
    const X0 = WX(x < m.xmin + len / 2 ? m.xmin : m.xmax), yT = WY(g0), vT = V(g0);
    const pos = [X0, 0, zf, X0, yT, zf, X0, yT, zb, X0, 0, zb];
    const uv = side === 'L' ? [1, 0, 1, vT, 0, vT, 0, 0] : [0, 0, 0, vT, 1, vT, 1, 0];
    mesh(pos, uv, side === 'L' ? [0, 2, 1, 0, 3, 2] : [0, 1, 2, 0, 2, 3], mat(texFrom(ec)));
  }
  // Taban
  mesh([-Lw/2, 0, zf, Lw/2, 0, zf, Lw/2, 0, zb, -Lw/2, 0, zb], null, [0, 2, 1, 0, 3, 2], mat(null));

  // Kenar çizgileri
  const lp = [];
  const addPoly = pts => { for (let i = 1; i < pts.length; i++) lp.push(...pts[i - 1], ...pts[i]); };
  addPoly(xs.map(x => [WX(x), WY(m.ground(x)), zf]));
  addPoly(xs.map(x => [WX(x), WY(m.ground(x)), zb]));
  addPoly([[-Lw/2, 0, zf], [Lw/2, 0, zf], [Lw/2, 0, zb], [-Lw/2, 0, zb], [-Lw/2, 0, zf]]);
  for (const x of [m.xmin, m.xmax]) for (const z of [zf, zb]) addPoly([[WX(x), 0, z], [WX(x), WY(m.ground(x)), z]]);
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  const lm = new THREE.LineBasicMaterial({color:0x1b2530}); V3.disp.push(lm);
  V3.group.add(new THREE.LineSegments(lg, lm));

  // Sondajlar
  const bhMat = new THREE.MeshLambertMaterial({color:0xffffff}); V3.disp.push(bhMat);
  const capMat = new THREE.MeshLambertMaterial({color:0x22313f}); V3.disp.push(capMat);
  for (const b of m.bhs){
    if (b.ch < m.xmin || b.ch > m.xmax) continue;
    const h = Math.max(0.05, b.depth / rng * Hw), yTop = WY(b.elev), rr = Math.max(0.035, Lw * 0.004);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, h + 0.12, 16), bhMat);
    cyl.position.set(WX(b.ch), yTop - h / 2 + 0.06, zf); V3.group.add(cyl);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(rr * 1.6, rr * 1.6, 0.04, 16), capMat);
    cap.position.set(WX(b.ch), yTop + 0.12, zf); V3.group.add(cap);
    const lbl = textSprite(b.name || 'SK'); lbl.position.set(WX(b.ch), yTop + 0.45, zf); V3.group.add(lbl);
  }
  // Yön etiketleri
  const P = state.project;
  if (P.dirLeft){ const s = textSprite(P.dirLeft, '#1f7a4d', 56); s.position.set(-Lw/2 - 0.5, WY(m.ground(m.xmin)) + 0.5, 0); V3.group.add(s); }
  if (P.dirRight){ const s = textSprite(P.dirRight, '#1f7a4d', 56); s.position.set(Lw/2 + 0.5, WY(m.ground(m.xmax)) + 0.5, 0); V3.group.add(s); }

  V3.group.position.set(0, 0, 0);
  V3.grid.position.y = -0.02;
}
function save3DPNG(){
  V3.controls.update(); V3.renderer.render(V3.scene, V3.camera);
  V3.renderer.domElement.toBlob(b => download(b, 'Jeolojik Kesit 3D.png'), 'image/png');
}

/* ---------- Başlat ---------- */
state = load();
// Eski sürümden gelen, hiç kaydedilmemiş ve içerik barındıran kesit "kaydedilmemiş" sayılır
if (state._dirty === undefined) state._dirty = !state._lib && (state.bodies.length > 0 || state.boreholes.length > 0 || state.topo.pts.length > 2);
updateDocName();
histReset();
document.getElementById('modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal('cancel'); });
document.addEventListener('input', e => {
  if (e.target.id !== 'libSearch') return;
  const q = trLow(e.target.value);
  document.querySelectorAll('.kcard').forEach(c => c.style.display = !q || c.dataset.q.includes(q) ? '' : 'none');
});
if (TABS.some(t => '#' + t[0] === location.hash)) ui.tab = location.hash.slice(1);
renderPanel();
scheduleDraw();
</script>
