async function libAction(a, t){
  const id = t.dataset.id;
  switch (a){
    case 'libSave': await saveToLibrary(document.getElementById('libName').value); return openLibrary();
    case 'libSaveNew': await saveToLibrary(document.getElementById('libName').value, true); return openLibrary();
    case 'libNew': closeModal(); return newBlankPage();
    case 'libOpen': {
      if (state._lib && state._lib.id === id && !state._dirty){ closeModal(); return; }
      closeModal();
      if (!(await guardUnsaved('Başka bir kesit açmadan'))) return openLibrary();
      closeModal();
      const r = await KDB.get(id); if (!r) return;
      loadSection(r.data, {id:r.id, name:r.name}); toast(`“${r.name}” açıldı`); return;
    }
    case 'libRename': {
      const r = await KDB.get(id); const n = prompt('Yeni kesit adı:', r.name); if (!n || !n.trim()) return;
      r.name = n.trim(); await KDB.put(r);
      if (state._lib && state._lib.id === id){ state._lib.name = r.name; save(true); }
      return openLibrary();
    }
    case 'libDup': {
      const r = await KDB.get(id);
      await KDB.put({...r, id:'k' + Date.now().toString(36) + uid(), name:r.name + ' (kopya)', createdAt:Date.now(), savedAt:Date.now()});
      return openLibrary();
    }
    case 'libDel': {
      const r = await KDB.get(id);
      if (!confirm(`“${r.name}” kalıcı olarak silinsin mi?`)) return;
      await KDB.del(id);
      if (state._lib && state._lib.id === id){ state._lib = null; state._dirty = true; save(true); }
      toast('Kesit silindi'); return openLibrary();
    }
  }
}
async function quickSave(){
  if (state._lib){ await saveToLibrary(state._lib.name); return; }
  openLibrary(); setTimeout(() => document.getElementById('libName')?.select(), 60);
}

/* =========================================================
   3D GÖRÜNÜM (three.js) — kesiti blok diyagram olarak modeller
   ========================================================= */
let V3 = null;
function open3D(){
  if (!window.THREE || !THREE.OrbitControls){ alert('3D kütüphanesi yüklenemedi. "lib" klasörünün index.html ile aynı yerde olduğundan emin olun.'); return; }
  if (!computeModel()){ alert('Önce kesiti oluşturun.'); return; }
  document.getElementById('v3d').classList.add('on');
  if (!V3) init3D();
  resize3D(); rebuild3D(); reset3DView();
}
function close3D(){ document.getElementById('v3d').classList.remove('on'); }
function init3D(){
  const host = document.getElementById('v3dCanvas');
  const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9eef3);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.4;
  controls.minDistance = 3; controls.maxDistance = 80;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 0.95));
  const dl = new THREE.DirectionalLight(0xffffff, 0.35); dl.position.set(6, 12, 9); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.2); dl2.position.set(-8, 4, -6); scene.add(dl2);
  const grid = new THREE.GridHelper(40, 40, 0xb8c2cc, 0xd3dae1); scene.add(grid);
  const group = new THREE.Group(); scene.add(group);
  V3 = {renderer, scene, camera, controls, group, grid, depth:0.3, vmul:1, disp:[]};
  const loop = () => {
    requestAnimationFrame(loop);
    if (!document.getElementById('v3d').classList.contains('on')) return;
    controls.update(); renderer.render(scene, camera);
  };
  loop();
  window.addEventListener('resize', () => { if (V3) resize3D(); });
  document.getElementById('v3Depth').addEventListener('input', e => { V3.depth = +e.target.value; rebuild3D(); });
  document.getElementById('v3Vmul').addEventListener('input', e => { V3.vmul = +e.target.value; rebuild3D(); });
}
function resize3D(){
  const host = document.getElementById('v3dCanvas'), w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  V3.renderer.setSize(w, h, false); V3.camera.aspect = w / h; V3.camera.updateProjectionMatrix();
}
function reset3DView(){
  const d = V3.dims || {Lw:10, Hw:3, Dw:3};
  V3.camera.position.set(d.Lw * 0.55, d.Hw * 0.9 + 4, d.Lw * 1.15 + d.Dw);
  V3.controls.target.set(0, d.Hw * 0.35, 0); V3.controls.update();
}
function textSprite(txt, color = '#111', size = 44){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `bold ${size}px Arial`; const w = Math.ceil(g.measureText(txt).width) + 24;
  c.width = w; c.height = size + 20;
  g.font = `bold ${size}px Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 8; g.strokeStyle = 'rgba(255,255,255,.95)'; g.strokeText(txt, w / 2, c.height / 2);
  g.fillStyle = color; g.fillText(txt, w / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  const k = 0.0048; sp.scale.set(w * k, c.height * k, 1); sp.renderOrder = 10;
  V3.disp.push(tex, sp.material);
  return sp;
}
function rebuild3D(){
  if (!V3) return;
  // Eskileri temizle
  V3.group.children.slice().forEach(o => { V3.group.remove(o); o.geometry && o.geometry.dispose(); });
  V3.disp.forEach(d => d.dispose && d.dispose()); V3.disp = [];

  // 2D kesiti çiz ve kesit alanını doku olarak kes
  const S = 1.5, off = document.createElement('canvas');
  const r = draw(off, S, false); if (!r) return;
  const {m, lay} = r;
  const fc = document.createElement('canvas');
  fc.width = Math.round(lay.plotW * S); fc.height = Math.round(lay.plotH * S);
  fc.getContext('2d').drawImage(off, lay.ml * S, lay.mt * S, lay.plotW * S, lay.plotH * S, 0, 0, fc.width, fc.height);

  const Lw = 10, Hw = 10 * lay.plotH / lay.plotW * V3.vmul, Dw = Lw * V3.depth;
  V3.dims = {Lw, Hw, Dw};
  const len = m.xmax - m.xmin, rng = m.top - m.base;
  const WX = x => (x - m.xmin) / len * Lw - Lw / 2;
  const WY = el => (el - m.base) / rng * Hw;
  const U = x => (x - m.xmin) / len, V = el => (el - m.base) / rng;
  const xs = m.gxs, zf = Dw / 2, zb = -Dw / 2;

  // Bir noktadaki birim (en üstteki gövde, yoksa ana birim)
  const ownerAt = (x, y) => {
    for (let k = m.polys.length - 1; k >= 0; k--){
      const p = m.polys[k];
      if (inPoly(p.pts, x, y)){
        const isBg = p.body.fid === '__bg';
        return {f:effF(fById(p.fid), isBg ? state.bgColor : p.body.color), sc:isBg ? state.bgScale : p.body.pscale, key:p.fid + '#' + k};
      }
    }
    return {f:effF(fById(state.bg), state.bgColor), sc:state.bgScale, key:'bg'};
  };
  const texFrom = cnv => { const t = new THREE.CanvasTexture(cnv); t.anisotropy = 8; V3.disp.push(t); return t; };
  const mat = (map, side = THREE.DoubleSide) => { const mm = new THREE.MeshLambertMaterial({map, side, color:map ? 0xffffff : 0x8e969e}); V3.disp.push(mm); return mm; };
  const mesh = (pos, uv, idx, material) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    if (uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const o = new THREE.Mesh(g, material); V3.group.add(o); return o;
  };

  // Ön ve arka yüz (kesit dokusu)
  const faceTex = texFrom(fc);
  for (const [z, flip] of [[zf, false], [zb, true]]){
    const pos = [], uv = [], idx = [];
    xs.forEach((x, i) => {
      const g = m.ground(x);
      pos.push(WX(x), WY(g), z, WX(x), 0, z); uv.push(U(x), V(g), U(x), 0);
      if (i){ const a = (i - 1) * 2, b = i * 2; flip ? idx.push(a, a + 1, b, b, a + 1, b + 1) : idx.push(a, b, a + 1, b, b + 1, a + 1); }
    });
    mesh(pos, uv, idx, mat(faceTex));
  }

  // Üst yüzey: yüzeylenen birimlerin desenleri
  const pxPerW = lay.plotW / Lw;                      // mantıksal px / dünya birimi
  const tc = document.createElement('canvas'), tW = lay.plotW, tH = Math.max(8, Math.round(Dw * pxPerW));
  tc.width = Math.round(tW * S); tc.height = Math.round(tH * S);
  const tg = tc.getContext('2d'); tg.scale(S, S);
  const eps = rng * 0.004;
  let runStart = 0, runOwner = null;
  const N = 400;
  for (let i = 0; i <= N; i++){
    const x = m.xmin + len * Math.min(i, N - 0.001) / N, o = i < N ? ownerAt(x, m.ground(x) - eps) : null;
    if (!runOwner || !o || o.key !== runOwner.key){
      if (runOwner){ tg.beginPath(); tg.rect(runStart / N * tW, 0, (i - runStart) / N * tW + 1, tH); fillFormation(tg, runOwner.f, S, runOwner.sc); }
      runOwner = o; runStart = i;
    }
  }
  {
    const pos = [], uv = [], idx = [];
    xs.forEach((x, i) => {
      const y = WY(m.ground(x));
      pos.push(WX(x), y, zf, WX(x), y, zb); uv.push(U(x), 1, U(x), 0);
      if (i){ const a = (i - 1) * 2, b = i * 2; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    });
    mesh(pos, uv, idx, mat(texFrom(tc)));
  }

  // Yan yüzler: o noktadaki düşey istif
  for (const [x, side] of [[m.xmin + len * 0.0005, 'L'], [m.xmax - len * 0.0005, 'R']]){
    const g0 = m.ground(x);
    const ec = document.createElement('canvas'), eW = tH, eH = lay.plotH;
    ec.width = Math.round(eW * S); ec.height = Math.round(eH * S);
    const eg = ec.getContext('2d'); eg.scale(S, S);
    const NY = 300; let rs = 0, ro = null;
    for (let j = 0; j <= NY; j++){
      const el = m.top - rng * Math.min(j, NY - 0.001) / NY;
      const o = j < NY ? (el > g0 ? {key:'air'} : ownerAt(x, el)) : null;
      if (!ro || !o || o.key !== ro.key){
        if (ro && ro.f){ eg.beginPath(); eg.rect(0, rs / NY * eH, eW, (j - rs) / NY * eH + 1); fillFormation(eg, ro.f, S, ro.sc); }
        ro = o; rs = j;
      }
    }
    const X0 = WX(x < m.xmin + len / 2 ? m.xmin : m.xmax), yT = WY(g0), vT = V(g0);
    const pos = [X0, 0, zf, X0, yT, zf, X0, yT, zb, X0, 0, zb];
    const uv = side === 'L' ? [1, 0, 1, vT, 0, vT, 0, 0] : [0, 0, 0, vT, 1, vT, 1, 0];
    mesh(pos, uv, side === 'L' ? [0, 2, 1, 0, 3, 2] : [0, 1, 2, 0, 2, 3], mat(texFrom(ec)));
  }
  // Taban
  mesh([-Lw/2, 0, zf, Lw/2, 0, zf, Lw/2, 0, zb, -Lw/2, 0, zb], null, [0, 2, 1, 0, 3, 2], mat(null));

  // Kenar çizgileri
  const lp = [];
  const addPoly = pts => { for (let i = 1; i < pts.length; i++) lp.push(...pts[i - 1], ...pts[i]); };
  addPoly(xs.map(x => [WX(x), WY(m.ground(x)), zf]));
  addPoly(xs.map(x => [WX(x), WY(m.ground(x)), zb]));
  addPoly([[-Lw/2, 0, zf], [Lw/2, 0, zf], [Lw/2, 0, zb], [-Lw/2, 0, zb], [-Lw/2, 0, zf]]);
  for (const x of [m.xmin, m.xmax]) for (const z of [zf, zb]) addPoly([[WX(x), 0, z], [WX(x), WY(m.ground(x)), z]]);
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  const lm = new THREE.LineBasicMaterial({color:0x1b2530}); V3.disp.push(lm);
  V3.group.add(new THREE.LineSegments(lg, lm));

  // Sondajlar
  const bhMat = new THREE.MeshLambertMaterial({color:0xffffff}); V3.disp.push(bhMat);
  const capMat = new THREE.MeshLambertMaterial({color:0x22313f}); V3.disp.push(capMat);
  for (const b of m.bhs){
    if (b.ch < m.xmin || b.ch > m.xmax) continue;
    const h = Math.max(0.05, b.depth / rng * Hw), yTop = WY(b.elev), rr = Math.max(0.035, Lw * 0.004);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, h + 0.12, 16), bhMat);
    cyl.position.set(WX(b.ch), yTop - h / 2 + 0.06, zf); V3.group.add(cyl);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(rr * 1.6, rr * 1.6, 0.04, 16), capMat);
    cap.position.set(WX(b.ch), yTop + 0.12, zf); V3.group.add(cap);
    const lbl = textSprite(b.name || 'SK'); lbl.position.set(WX(b.ch), yTop + 0.45, zf); V3.group.add(lbl);
  }
  // Yön etiketleri
  const P = state.project;
  if (P.dirLeft){ const s = textSprite(P.dirLeft, '#1f7a4d', 56); s.position.set(-Lw/2 - 0.5, WY(m.ground(m.xmin)) + 0.5, 0); V3.group.add(s); }
  if (P.dirRight){ const s = textSprite(P.dirRight, '#1f7a4d', 56); s.position.set(Lw/2 + 0.5, WY(m.ground(m.xmax)) + 0.5, 0); V3.group.add(s); }

  V3.group.position.set(0, 0, 0);
  V3.grid.position.y = -0.02;
}
function save3DPNG(){
  V3.controls.update(); V3.renderer.render(V3.scene, V3.camera);
  V3.renderer.domElement.toBlob(b => download(b, 'Jeolojik Kesit 3D.png'), 'image/png');
}

/* ---------- Başlat ---------- */
state = load();
// Eski sürümden gelen, hiç kaydedilmemiş ve içerik barındıran kesit "kaydedilmemiş" sayılır
if (state._dirty === undefined) state._dirty = !state._lib && (state.bodies.length > 0 || state.boreholes.length > 0 || state.topo.pts.length > 2);
updateDocName();
document.getElementById('modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal('cancel'); });
document.addEventListener('input', e => {
  if (e.target.id !== 'libSearch') return;
  const q = trLow(e.target.value);
  document.querySelectorAll('.kcard').forEach(c => c.style.display = !q || c.dataset.q.includes(q) ? '' : 'none');
});
if (TABS.some(t => '#' + t[0] === location.hash)) ui.tab = location.hash.slice(1);
renderPanel();
scheduleDraw();
</script>
